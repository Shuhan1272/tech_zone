
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="0 0 64 64"
  fill="none"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#168BFF"/>
      <stop offset="55%" stop-color="#0756D9"/>
      <stop offset="100%" stop-color="#092D91"/>
    </linearGradient>

    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCEAFF"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD76A"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect
    x="2"
    y="2"
    width="60"
    height="60"
    rx="15"
    fill="url(#bg)"
  />

  <!-- Subtle highlight -->
  <path
    d="M17 5H47C54 5 59 10 59 17V20H5V17C5 10 10 5 17 5Z"
    fill="white"
    opacity="0.08"
  />

  <!-- Edit box -->
  <path
    d="M39 18H21C17.7 18 15 20.7 15 24V43C15 46.3 17.7 49 21 49H42C45.3 49 48 46.3 48 43V31"
    stroke="white"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Pencil -->
  <g transform="rotate(0 34 30)">
    <path
      d="M27 36L29 28L43 14L50 21L36 35L27 36Z"
      fill="url(#pencil)"
    />

    <path
      d="M43 14L47 10C48.1 8.9 49.9 8.9 51 10L54 13C55.1 14.1 55.1 15.9 54 17L50 21L43 14Z"
      fill="url(#gold)"
    />

    <path
      d="M27 36L29 28L35 34L27 36Z"
      fill="#FFFFFF"
    />

    <path
      d="M27 36L29 32L31 34Z"
      fill="#0B3C98"
    />
  </g>
